name: auto-merge

# Every pull request joins the merge queue by itself once ci-gate is green (Moli standard 003).
# Not for drafts, forks (they get no secrets, and nothing from outside merges without a person), or
# pull requests whose base is not the default branch (a stacked one has no merge queue).
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize, edited]

permissions: {}

jobs:
  enqueue:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      (github.event.action != 'edited' || github.event.changes.base != null)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./actions/auto-merge
        with:
          app-id: ${{ secrets.AUTOMERGE_APP_ID }}
          private-key: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}
          pull-request: ${{ github.event.pull_request.number }}
