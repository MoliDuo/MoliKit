name: deploy
description: >-
  Build the image of one commit, join the tailnet for this run only, and send the image to the
  server's deploy entry over SSH (Moli standard 005). Call it from a workflow that runs after a green
  ci on main, in a job with `permissions: contents: read`. Secrets come in as inputs.
inputs:
  app:
    description: Application id (standard 001), e.g. cashier.
    required: true
  sha:
    description: The 40-character commit to build and deploy.
    required: true
  host-key:
    description: The server's SSH host key line (public, checked, not secret).
    required: true
  server:
    description: Server address (the DEPLOY_SERVER secret).
    required: true
  server-user:
    description: Deploy account on the server (the DEPLOY_SERVER_USER secret).
    required: true
  ssh-key:
    description: Deploy SSH private key (the DEPLOY_SSH_KEY secret).
    required: true
  tailscale-client-id:
    description: The DEPLOY_TAILSCALE_CLIENT_ID secret.
    required: true
  tailscale-client-secret:
    description: The DEPLOY_TAILSCALE_CLIENT_SECRET secret.
    required: true
runs:
  using: composite
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        ref: ${{ inputs.sha }}

    - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

    # Build once; the image is tagged with the commit sha, never latest
    - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
      with:
        context: .
        build-args: VERSION=${{ inputs.sha }}
        tags: moli-${{ inputs.app }}:${{ inputs.sha }}
        outputs: type=docker,dest=/tmp/image.tar
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # Join the tailnet for this run only; the access rules allow only the server SSH port
    - uses: tailscale/github-action@6cae46e2d796f265265cfcf628b72a32b4d7cade # v3
      with:
        oauth-client-id: ${{ inputs.tailscale-client-id }}
        oauth-secret: ${{ inputs.tailscale-client-secret }}
        tags: tag:github-deploy

    - name: Send the image and deploy
      shell: bash
      env:
        APP: ${{ inputs.app }}
        SHA: ${{ inputs.sha }}
        HOST_KEY: ${{ inputs.host-key }}
        SERVER: ${{ inputs.server }}
        SERVER_USER: ${{ inputs.server-user }}
        DEPLOY_SSH_KEY: ${{ inputs.ssh-key }}
      run: |
        set -euo pipefail
        install -m 700 -d ~/.ssh
        printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
        printf '%s %s\n' "$SERVER" "$HOST_KEY" > ~/.ssh/known_hosts
        # The forced command on the server reads: first line "<app> <sha>", then the image archive
        { printf '%s %s\n' "$APP" "$SHA"; cat /tmp/image.tar; } \
          | ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes "$SERVER_USER@$SERVER"
        rm -f ~/.ssh/deploy_key
