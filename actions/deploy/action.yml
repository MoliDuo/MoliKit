name: deploy
description: >-
  Deploy a commit only if it is still the newest on the branch (older ones are skipped). Build the image, join the tailnet for this run only, and send the image to the
  server's deploy entry over SSH (Moli standard 005). Call it from a workflow that runs after a green
  ci on main, in a job with `permissions: contents: read`. Secrets come in as inputs.
inputs:
  app:
    description: Application id (standard 001), e.g. cashier.
    required: true
  sha:
    description: The 40-character commit to build and deploy.
    required: true
  host-key:
    description: The server's SSH host key line (public, checked, not secret).
    required: true
  server:
    description: Server address (the DEPLOY_SERVER secret).
    required: true
  server-user:
    description: Deploy account on the server (the DEPLOY_SERVER_USER secret).
    required: true
  ssh-key:
    description: Deploy SSH private key (the DEPLOY_SSH_KEY secret).
    required: true
  tailscale-client-id:
    description: The DEPLOY_TAILSCALE_CLIENT_ID secret.
    required: true
  tailscale-client-secret:
    description: The DEPLOY_TAILSCALE_CLIENT_SECRET secret.
    required: true
  branch:
    description: The branch that deploys. Only its newest commit is deployed.
    default: main
  github-token:
    description: Token that may read the repository's commits.
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    # A slow or re-run CI must not put an older commit on top of a newer one
    - id: latest
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        BRANCH: ${{ inputs.branch }}
        SHA: ${{ inputs.sha }}
      run: |
        set -euo pipefail
        head=$(gh api "repos/$GITHUB_REPOSITORY/commits/$BRANCH" --jq .sha)
        if [ "$head" = "$SHA" ]; then
          echo "latest=true" >> "$GITHUB_OUTPUT"
        else
          echo "latest=false" >> "$GITHUB_OUTPUT"
          echo "::notice::Skipped: $SHA is not the newest commit on $BRANCH ($head)."
        fi

    - if: steps.latest.outputs.latest == 'true'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        ref: ${{ inputs.sha }}

    - if: steps.latest.outputs.latest == 'true'
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    # Build once; the image is tagged with the commit sha, never latest. No build cache: it filled the
    # repository's 10 GB cache quota.
    - if: steps.latest.outputs.latest == 'true'
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        build-args: VERSION=${{ inputs.sha }}
        tags: moli-${{ inputs.app }}:${{ inputs.sha }}
        outputs: type=docker,dest=/tmp/image.tar

    # Join the tailnet for this run only; the access rules allow only the server SSH port
    - if: steps.latest.outputs.latest == 'true'
      uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
      with:
        oauth-client-id: ${{ inputs.tailscale-client-id }}
        oauth-secret: ${{ inputs.tailscale-client-secret }}
        tags: tag:github-deploy

    - name: Send the image and deploy
      if: steps.latest.outputs.latest == 'true'
      shell: bash
      env:
        APP: ${{ inputs.app }}
        SHA: ${{ inputs.sha }}
        HOST_KEY: ${{ inputs.host-key }}
        SERVER: ${{ inputs.server }}
        SERVER_USER: ${{ inputs.server-user }}
        DEPLOY_SSH_KEY: ${{ inputs.ssh-key }}
      run: |
        set -euo pipefail
        install -m 700 -d ~/.ssh
        printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
        printf '%s %s\n' "$SERVER" "$HOST_KEY" > ~/.ssh/known_hosts
        # The forced command on the server reads: first line "<app> <sha>", then the image archive
        { printf '%s %s\n' "$APP" "$SHA"; cat /tmp/image.tar; } \
          | ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes "$SERVER_USER@$SERVER"
        rm -f ~/.ssh/deploy_key
